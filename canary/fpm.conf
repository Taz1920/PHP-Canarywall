; PHP Sentinel — FPM Pool Configuration
;
; Static pool of 4 workers. Recycled every 500 requests to kill stale
; global state (defense in depth against CVE-2026-109619's cross-request
; corruption). 3-second request termination timeout — request parsing is
; fast; anything longer means the worker hung.

[canary]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = static
pm.max_children = 4
pm.max_requests = 500

; Kill workers that take longer than 3 seconds to handle a request.
; Request parsing is fast — if it takes longer, the worker is hung
; (infinite loop, deadlock, or stall in the SAPI layer).
request_terminate_timeout = 3s

; Logging
access.log = /dev/null
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 2s

; Security — no environment leakage
clear_env = yes

; Test mode — pass through only when container has SENTINEL_TEST_MODE=1
env[SENTINEL_TEST_MODE] = $SENTINEL_TEST_MODE
