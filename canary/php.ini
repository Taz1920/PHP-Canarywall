; PHP Sentinel — Canary php.ini
;
; This configuration intentionally ENABLES the vulnerable code paths
; so the canary exercises them.  The canary runs the SAME PHP version
; as production — it will crash on the same inputs production would.
; The proxy catches the crash and drops the request.

; ── Session upload progress (CVE-2026-109618 attack surface) ──
; The upload-progress handler is exercised during multipart parsing.  Must be ON.
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 1
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 1

; Session configuration — use files, fast tmp path
session.save_handler = files
session.save_path = /tmp/php-sessions
session.use_strict_mode = 1

; ── CVE-2026-109618: OOM handling ──
; Set a real memory limit so the OOM code path actually fires.
; The canary script uses almost no memory, so if a request pushes
; past this, it's doing something the OOM handler will touch.
memory_limit = 16M

; ── Request parsing settings ──
; Mirror typical production defaults so the canary parses requests
; the same way production would.
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20
max_input_vars = 1000
max_input_nesting_level = 64

; ── Performance ──
; No opcode cache needed — single script, stateless.
opcache.enable = 0

; ── Error handling ──
; Log errors but don't display — the proxy reads HTTP status, not body.
display_errors = Off
log_errors = On
error_log = /var/log/php-canary-errors.log
error_reporting = E_ALL

; ── Disable unnecessary extensions ──
; The canary doesn't need database, curl, etc.  Fewer loaded extensions
; means a smaller attack surface on the canary itself.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,dl
disable_classes =
